<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="100%">
  <!-- Clean Subtle Background -->
  <rect width="800" height="60" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  
  <!-- Content -->
  <g transform="translate(20, 12)">
    <!-- Small Crest -->
    <circle cx="18" cy="18" r="16" fill="#0A1F44" stroke="#D97706" stroke-width="1.5" />
    <text x="18" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF">NCB</text>

    <!-- Authority Text -->
    <text x="44" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#0F172A" letter-spacing="0.8">
      NATIONAL COORDINATION BOARD (NCB) — GATE
    </text>
    <text x="44" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="9" fill="#64748B" letter-spacing="0.4">
      Indian Institute of Science (IISc Bangalore) &amp; Seven Indian Institutes of Technology (IITB, IITD, IITG, IITK, IITKGP, IITM, IITR)
    </text>

    <!-- TCS iON Standard Tag -->
    <rect x="660" y="5" width="110" height="24" rx="3" fill="#0A1F44" />
    <text x="715" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#38BDF8" letter-spacing="0.5">
      TCS iON CBT COMPLIANT
    </text>
  </g>
</svg>
